name: Cloud Windows Remote Access

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: 'Duration to keep Cloud Windows VM alive (hours, max 6)'
        required: true
        default: '2'

jobs:
  launch_remote_session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WinRoid-Agent and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,windows]"
          Write-Host "[OK] WinRoid-Agent installed and ready."

      - name: Configure Windows Desktop & Permissions
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $Password = ConvertTo-SecureString "WinRoid@Agent2026" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Write-Host "[OK] Windows user runneradmin configured."

      - name: Launch 1-Click Web Browser & SSH Cloud Access (Firewall-Proof)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
          connect-timeout: 30m
