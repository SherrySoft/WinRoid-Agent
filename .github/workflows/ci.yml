name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Quality Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black

      - name: Check Code Formatting (Black)
        run: |
          black --check --line-length 100 src tests

      - name: Lint Codebase (Ruff)
        run: |
          ruff check src tests

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v tests/

  build-check:
    name: Package Build & Distribution Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Source Distribution and Wheel
        run: |
          python -m build --sdist --wheel

      - name: Validate Package Metadata with Twine
        run: |
          python -m twine check dist/*

      - name: Test Wheel Installation & CLI Entrypoint
        run: |
          python -m pip install dist/*.whl
          python -m android_gemini_agent.cli.app --help
