name: 🖥️ Cloud Windows RDP Desktop

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: 'Duration to keep Cloud Windows VM alive (hours, max 6)'
        required: true
        default: '2'

jobs:
  launch_rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WinRoid-Agent & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,windows]"

      - name: Enable Windows Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: Create / Set Runner Password
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "WinRoid@Agent2026" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Write-Host "✓ Runner user password set successfully."

      - name: Download and Launch Ngrok RDP Tunnel
        shell: powershell
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if (-not $env:NGROK_AUTH_TOKEN) {
            Write-Host "::error::NGROK_AUTH_TOKEN is missing! Please add it to your GitHub Repository Secrets."
            exit 1
          }

          Write-Host "Downloading Ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive ngrok.zip -DestinationPath . -Force

          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

          Write-Host "Starting TCP Tunnel on RDP Port 3389..."
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log"

          Start-Sleep -Seconds 6

          $Tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels
          $RdpUrl = $Tunnels[0].public_url.Replace("tcp://", "")

          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host "🎉 CLOUD WINDOWS DESKTOP IS LIVE & READY FOR RDP!" -ForegroundColor Green
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "👉 Remote Desktop Address:  $RdpUrl" -ForegroundColor Yellow
          Write-Host "👉 Username:                runneradmin" -ForegroundColor Cyan
          Write-Host "👉 Password:                WinRoid@Agent2026" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host "Connecting from your PC:"
          Write-Host "1. Press Win + R, type 'mstsc' and press Enter."
          Write-Host "2. In 'Computer', paste: $RdpUrl"
          Write-Host "3. Login with runneradmin / WinRoid@Agent2026"
          Write-Host "4. Inside the VM, open terminal and test WinRoid-Agent with live GUI!"
          Write-Host "============================================================" -ForegroundColor Green

      - name: Keep Cloud Windows Desktop Active
        shell: powershell
        run: |
          $Hours = [int]"${{ github.event.inputs.session_hours }}"
          if ($Hours -le 0) { $Hours = 2 }
          $Seconds = $Hours * 3600
          Write-Host "Session active for $Hours hours ($Seconds seconds)..."
          Start-Sleep -Seconds $Seconds
