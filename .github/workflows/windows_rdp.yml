name: Cloud Windows RDP Desktop

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: 'Duration to keep Cloud Windows VM alive (hours, max 6)'
        required: true
        default: '2'

jobs:
  launch_rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WinRoid-Agent and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,windows]"

      - name: Enable Windows Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Write-Host "[OK] Remote Desktop enabled."

      - name: Create or Set Runner Password
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "WinRoid@Agent2026" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
          Write-Host "[OK] Runner user password configured."

      - name: Launch Free Cloud RDP Tunnel (Zero Card / Zero Signup)
        shell: powershell
        run: |
          Write-Host "Downloading open-source TCP tunnel..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive bore.zip -DestinationPath . -Force

          Write-Host "Starting TCP Tunnel on RDP Port 3389..."
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore_err.log"

          $Port = ""
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "bore.log") {
              $Content = Get-Content "bore.log" -Raw
              if ($Content -match "listening at bore\.pub:(\d+)") {
                $Port = $Matches[1]
                break
              }
            }
          }

          if (-not $Port) {
            Write-Host "::error::Failed to obtain public tunnel port from bore.pub. Log:"
            Get-Content "bore.log" -ErrorAction SilentlyContinue
            Get-Content "bore_err.log" -ErrorAction SilentlyContinue
            exit 1
          }

          $RdpHost = "bore.pub:$Port"

          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host "CLOUD WINDOWS DESKTOP IS LIVE AND READY FOR RDP!" -ForegroundColor Green
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Remote Desktop Address:  $RdpHost" -ForegroundColor Yellow
          Write-Host "Username:                runneradmin" -ForegroundColor Cyan
          Write-Host "Password:                WinRoid@Agent2026" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "============================================================" -ForegroundColor Green
          Write-Host "Connecting from your PC:"
          Write-Host "1. Press Win + R, type 'mstsc' and press Enter."
          Write-Host "2. In Computer field, paste: $RdpHost"
          Write-Host "3. Login with runneradmin / WinRoid@Agent2026"
          Write-Host "4. Inside the VM, open terminal and test WinRoid-Agent with live GUI!"
          Write-Host "============================================================" -ForegroundColor Green

      - name: Keep Cloud Windows Desktop Active
        shell: powershell
        run: |
          $Hours = [int]"${{ github.event.inputs.session_hours }}"
          if ($Hours -le 0) { $Hours = 2 }
          $Seconds = $Hours * 3600
          Write-Host "Session active for $Hours hours ($Seconds seconds)..."
          Start-Sleep -Seconds $Seconds
