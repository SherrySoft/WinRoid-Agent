[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-gemini-agent"
version = "0.1.0"
description = "Production-grade AI agent for autonomous Android & Windows desktop automation using Gemini Visionless & VLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Android & Windows Gemini Automation Agent Contributors" }
]
keywords = [
    "android",
    "windows",
    "gemini",
    "google-genai",
    "ai-agent",
    "automation",
    "visionless",
    "vlm",
    "wireless-adb",
    "adb",
    "ui-automation",
    "llm-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
dependencies = [
    "google-genai>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.7.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pyperclip>=1.8.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-subtests>=0.10.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
all = [
    "android-gemini-agent[windows,dev]",
]

[project.urls]
Homepage = "https://github.com/android-gemini-agent/android-gemini-agent"
Documentation = "https://github.com/android-gemini-agent/android-gemini-agent#readme"
Repository = "https://github.com/android-gemini-agent/android-gemini-agent.git"
Issues = "https://github.com/android-gemini-agent/android-gemini-agent/issues"
Discussions = "https://github.com/android-gemini-agent/android-gemini-agent/discussions"
Changelog = "https://github.com/android-gemini-agent/android-gemini-agent/releases"

[project.scripts]
android-gemini = "android_gemini_agent.cli.app:main"
android-agent = "android_gemini_agent.cli.app:main"
gemini-agent = "android_gemini_agent.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
